buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'dev.flower.blockgenban'
base { archivesName = 'block-remap-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    uiTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { blockgen_ban { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run/ui-client')
            if (project.hasProperty('acceptanceDir')) workingDirectory project.file(project.property('acceptanceDir'))
            args '--width', '1280', '--height', '720'
            jvmArgs '-Xmx3G'
            if (project.hasProperty('uiTest')) {
                property 'blockgenban.ui.output', project.file(project.findProperty('acceptanceOutput') ?: 'work/ui/validation').absolutePath
                mods { blockgen_ban { source sourceSets.uiTest } }
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            }
        }
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}
jarJar.enable()
mixin {
    add sourceSets.main, 'blockgen_ban.refmap.json'
    config 'blockgen_ban.mixins.json'
}
tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('../../art/icon.png'))
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest.attributes 'MixinConfigs': 'blockgen_ban.mixins.json'
    finalizedBy 'reobfJar'
}
tasks.named('jarJar', Jar).configure {
    manifest.attributes 'MixinConfigs': 'blockgen_ban.mixins.json'
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
tasks.register('verificationJar', Jar) {
    from sourceSets.verification.output
    exclude 'blockgen_ban.refmap.json'
    archiveBaseName = 'blockgen-ban-verification'
    archiveVersion = 'dev'
}
reobf { verificationJar {} }
tasks.named('verificationJar').configure { finalizedBy 'reobfVerificationJar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(Jar).configureEach { from(rootProject.files('../../LICENSE', '../../LICENSE-ASSETS.md', '../../THIRD_PARTY.md')) }
