name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge-1.20.1
            java: '17'
          - platform: fabric-1.20.1
            java: '17'
          - platform: neoforge-1.21.1
            java: '21'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build platform
        working-directory: platforms/${{ matrix.platform }}
        run: bash ./gradlew build --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: block-remap-${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/block-remap-${{ matrix.platform }}-1.0.0.jar
